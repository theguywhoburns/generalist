[package]
name = "generalist"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.21.0", features = ["fusion", "store", "autodiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["ndarray", "cuda"]
ndarray = ["burn/ndarray"]
cuda = ["burn/cuda"]

[profile.dev]
# 1, not 0: this crate is a thin harness around burn's kernels, so almost all
# the arithmetic runs on the GPU and `opt-level = 0` only makes the host-side
# token bookkeeping slow. It still rebuilds far faster than `--release`, which
# is what actually costs time here.
opt-level = 1
