[package]
name = "generalist"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.21.0", features = ["fusion", "store", "autodiff"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["ndarray", "cuda"]
ndarray = ["burn/ndarray"]
cuda = ["burn/cuda"]

[profile.dev]
opt-level = 1
